# Free Web Service；Neon 连接串在 Render 环境变量中配置，不写入源码。
services:
  - type: web
    name: studyhub
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/zhanag61/studyhub
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
