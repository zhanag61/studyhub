{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="StudyHub：把学习计划、任务和知识记录放在一起。">
    <title>{% block title %}StudyHub · 学习与知识工作台{% endblock %}</title>
    <link rel="icon" href="{% static 'core/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header container">
      <a class="brand" href="{% url 'core:home' %}" aria-label="StudyHub 首页">
        <span class="brand-mark" aria-hidden="true">S<span>·</span></span>
        <span>StudyHub</span>
      </a>
      <span class="edition">学习与知识工作台</span>
    </header>
    <main id="main" class="container">{% block content %}{% endblock %}</main>
    <footer class="site-footer container">
      <span>StudyHub</span>
      <span>把每一次小进步，积累成自己的成长。</span>
    </footer>
  </body>
</html>
